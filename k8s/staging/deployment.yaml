
apiVersion: apps/v1
kind: Deployment

metadata:
  name: clouddeploy
  namespace: staging

spec:
  replicas: 2

  selector:
    matchLabels:
      app: clouddeploy

  template:
    metadata:
      labels:
        app: clouddeploy

    spec:
      containers:
        - name: clouddeploy
          image: ghcr.io/shafin123-tech/clouddeploy:0000000000000000000000000000000000000000
          ports:
            - containerPort: 8080
